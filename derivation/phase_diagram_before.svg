<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Phase diagram before carbonation</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#555555">Seven constituents; the five solid sub-phases are disjoint. Band heights are schematic.</text>

  <text x="228" y="66" text-anchor="end" font-size="13" font-weight="bold" fill="#111111">Volume</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Constituent</text>
  <text x="572" y="66" text-anchor="start" font-size="13" font-weight="bold" fill="#111111">Mass</text>

  <!-- ===== blocks ===== -->
  <g stroke-width="1.2">
    <rect x="290" y="70"  width="220" height="110" fill="#eaf2fa" stroke="#4a7fb5"/>
    <rect x="290" y="180" width="220" height="70"  fill="#bbd9f0" stroke="#2e6da4"/>
    <rect x="290" y="250" width="220" height="140" fill="#d8cfc0" stroke="#8a7b66"/>
    <rect x="290" y="390" width="220" height="40"  fill="#f2e2b8" stroke="#a8903f"/>
    <rect x="290" y="430" width="220" height="50"  fill="#f5d9d9" stroke="#b05a5a"/>
    <rect x="290" y="480" width="220" height="35"  fill="#f2e2b8" stroke="#a8903f"/>
    <rect x="290" y="515" width="220" height="30"  fill="#dedede" stroke="#888888"/>
  </g>

  <!-- ===== constituent names ===== -->
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="400" y="130">Gas (air)</text>
    <text x="400" y="220">Water</text>
    <text x="400" y="316">Soil minerals, non-carbonate</text>
    <text x="400" y="415">CaCO<tspan dy="4" font-size="10">3</tspan><tspan dy="-4" font-size="13"> native to the soil</tspan></text>
    <text x="400" y="460">Ca(OH)<tspan dy="4" font-size="10">2</tspan><tspan dy="-4" font-size="13"> &#8212; reactive lime</tspan></text>
    <text x="400" y="502">CaCO<tspan dy="4" font-size="10">3</tspan><tspan dy="-4" font-size="13"> in the lime</tspan></text>
    <text x="400" y="535">Inert impurity of the lime</text>
  </g>

  <!-- ===== volume labels (left) ===== -->
  <g font-size="13" fill="#111111" text-anchor="end">
    <text x="278" y="130">V<tspan dy="4" font-size="10">g</tspan></text>
    <text x="278" y="220">V<tspan dy="4" font-size="10">w</tspan></text>
    <text x="278" y="325">(1 &#8722; &#967;<tspan dy="4" font-size="10">cs</tspan><tspan dy="-4" font-size="13">) m</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4" font-size="13"> / G</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4" font-size="13"> &#961;</tspan><tspan dy="4" font-size="10">w</tspan></text>
    <text x="278" y="415">&#967;<tspan dy="4" font-size="10">cs</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4" font-size="13"> / G</tspan><tspan dy="4" font-size="10">c</tspan><tspan dy="-4" font-size="13"> &#961;</tspan><tspan dy="4" font-size="10">w</tspan></text>
    <text x="278" y="460">&#967;<tspan dy="4" font-size="10">p</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan><tspan dy="-4" font-size="13"> / G</tspan><tspan dy="4" font-size="10">p</tspan><tspan dy="-4" font-size="13"> &#961;</tspan><tspan dy="4" font-size="10">w</tspan></text>
    <text x="278" y="502">&#967;<tspan dy="4" font-size="10">c</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan><tspan dy="-4" font-size="13"> / G</tspan><tspan dy="4" font-size="10">c</tspan><tspan dy="-4" font-size="13"> &#961;</tspan><tspan dy="4" font-size="10">w</tspan></text>
    <text x="278" y="535">&#967;<tspan dy="4" font-size="10">i</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan><tspan dy="-4" font-size="13"> / G</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4" font-size="13"> &#961;</tspan><tspan dy="4" font-size="10">w</tspan></text>
  </g>

  <!-- ===== mass labels (right) ===== -->
  <g font-size="13" fill="#111111" text-anchor="start">
    <text x="522" y="130" fill="#666666">&#8776; 0</text>
    <text x="522" y="220">m<tspan dy="4" font-size="10">w</tspan></text>
    <text x="522" y="325">(1 &#8722; &#967;<tspan dy="4" font-size="10">cs</tspan><tspan dy="-4" font-size="13">) m</tspan><tspan dy="4" font-size="10">s</tspan></text>
    <text x="522" y="415">&#967;<tspan dy="4" font-size="10">cs</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">s</tspan></text>
    <text x="522" y="460">&#967;<tspan dy="4" font-size="10">p</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan></text>
    <text x="522" y="502">&#967;<tspan dy="4" font-size="10">c</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan></text>
    <text x="522" y="535">&#967;<tspan dy="4" font-size="10">i</tspan><tspan dy="-4" font-size="13"> m</tspan><tspan dy="4" font-size="10">l</tspan></text>
  </g>

  <!-- ===== left brackets: voids / solids ===== -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <path d="M 60 70 L 46 70 L 46 250 L 60 250"/>
    <path d="M 60 250 L 46 250 L 46 545 L 60 545"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="30" y="156">V<tspan dy="4" font-size="10">v</tspan></text>
    <text x="30" y="394">V<tspan dy="4" font-size="10">s</tspan></text>
  </g>
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <path d="M 14 70 L 6 70 L 6 545 L 14 545"/>
  </g>
  <text x="18" y="312" font-size="13" fill="#111111" transform="rotate(-90 18 312)" text-anchor="middle">V<tspan dy="4" font-size="10">t</tspan></text>

  <!-- ===== right brackets: soil / lime ===== -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <path d="M 690 250 L 704 250 L 704 430 L 690 430"/>
    <path d="M 690 430 L 704 430 L 704 545 L 690 545"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="start">
    <text x="712" y="344">m<tspan dy="4" font-size="10">s</tspan><tspan dy="-4" font-size="13">  as-received soil</tspan></text>
    <text x="712" y="492">m<tspan dy="4" font-size="10">l</tspan><tspan dy="-4" font-size="13">  as-batched lime</tspan></text>
  </g>

  <!-- ===== definitions footer ===== -->
  <g font-size="12.5" fill="#333333">
    <text x="20" y="574">&#967;<tspan dy="4" font-size="9.5">p</tspan><tspan dy="-4" font-size="12.5"> + &#967;</tspan><tspan dy="4" font-size="9.5">c</tspan><tspan dy="-4" font-size="12.5"> + &#967;</tspan><tspan dy="4" font-size="9.5">i</tspan><tspan dy="-4" font-size="12.5"> = 1 (lime composition)</tspan></text>
    <text x="270" y="574">&#946;<tspan dy="4" font-size="9.5">l</tspan><tspan dy="-4" font-size="12.5"> = m</tspan><tspan dy="4" font-size="9.5">l</tspan><tspan dy="-4" font-size="12.5"> / m</tspan><tspan dy="4" font-size="9.5">s</tspan></text>
    <text x="380" y="574">e = V<tspan dy="4" font-size="9.5">v</tspan><tspan dy="-4" font-size="12.5"> / V</tspan><tspan dy="4" font-size="9.5">s</tspan></text>
    <text x="480" y="574">S<tspan dy="4" font-size="9.5">r</tspan><tspan dy="-4" font-size="12.5"> = V</tspan><tspan dy="4" font-size="9.5">w</tspan><tspan dy="-4" font-size="12.5"> / V</tspan><tspan dy="4" font-size="9.5">v</tspan></text>
    <text x="600" y="574">w = m<tspan dy="4" font-size="9.5">w</tspan><tspan dy="-4" font-size="12.5"> / m</tspan><tspan dy="4" font-size="9.5">s</tspan></text>
    <text x="720" y="574">&#946;<tspan dy="4" font-size="9.5">l</tspan><tspan dy="-4" font-size="12.5">* = &#967;</tspan><tspan dy="4" font-size="9.5">p</tspan><tspan dy="-4" font-size="12.5"> &#946;</tspan><tspan dy="4" font-size="9.5">l</tspan><tspan dy="-4" font-size="12.5"> (effective lime)</tspan></text>
  </g>
</svg>
